spring.application.name=brokerage-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8081
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:1440}
app.cookie.secure=${COOKIE_SECURE:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.account.starting-cash=${STARTING_CASH:100000.00}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}